# Keep the Docker Hub repository page in sync with this repository's README.
#
# Generated by dockerhub-desc/make_workflows.py. Edit that template, not this file.
# Required repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
# The token may be the same PAT that docker/login-action uses; it needs the
# Read & Write permission so the account can change repository metadata.
name: Docker Hub description

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README_en.md"
      - "README_zh.md"
      - "README_dockerhub.md"
      - ".github/workflows/dockerhub-description.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the diff without writing to Docker Hub"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dockerhub-description-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_REPOSITORIES: oaklight/caddy
      README_FILE: README.md
      SHORT_DESCRIPTION: "Caddy built with DNS, cache, Trojan and S3 certificate-storage plugins."


      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync Docker Hub description
        run: python3 .github/scripts/sync_dockerhub_description.py

# Triggered on README changes, release publication and manual dispatch.
