name: Build Caddy

# Tracks upstream Caddy releases and publishes plugin builds to Docker Hub.
# A scheduled run resolves the latest release and skips tags that already
# exist, so a new Caddy version is built within a day of its release.
# Every variant is verified before the run is reported as successful.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      caddy_version:
        description: "Caddy version: 2.11.9, v2.11.9, or latest"
        default: latest
      variants:
        description: "Space-separated variants: default full"
        default: "default full"
      push:
        description: "Push images to Docker Hub"
        type: boolean
        default: true
      update_latest:
        description: "Also move latest and latest-alpine to this build"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Makefile"
      - "ci/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

env:
  IMAGE: oaklight/caddy

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      verify_matrix: ${{ steps.matrix.outputs.verify_matrix }}
    steps:
      - name: Resolve Caddy version
        id: version
        env:
          REQUESTED: ${{ inputs.caddy_version }}
        run: |
          set -eu
          V="${REQUESTED:-latest}"
          if [ "$V" = "latest" ]; then
            V=$(curl -fsSL https://api.github.com/repos/caddyserver/caddy/releases/latest \
                | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')
          fi
          V="${V#v}"
          [ -n "$V" ] || { echo "::error::cannot resolve Caddy version"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Caddy $V"

      - name: Build matrices
        id: matrix
        env:
          VARIANTS: ${{ inputs.variants }}
        run: |
          python3 - <<'PY'
          import json, os

          defs = {
              "default": dict(
                  suffix="huaweicloud-cache-s3",
                  with_huaweicloud="true", with_cloudflare="false", with_dnspod="false",
                  with_alidns="false", with_cache="true", with_s3_storage="true",
                  with_trojan="false"),
              "full": dict(
                  suffix="huaweicloud-cloudflare-dnspod-alidns-cache-s3-trojan",
                  with_huaweicloud="true", with_cloudflare="true", with_dnspod="true",
                  with_alidns="true", with_cache="true", with_s3_storage="true",
                  with_trojan="true"),
          }
          # Package fragments, matched against `caddy list-modules --packages`.
          packages = {
              "with_huaweicloud": "caddy-dns/huaweicloud",
              "with_cloudflare": "caddy-dns/cloudflare",
              "with_dnspod": "caddy-dns/dnspod",
              "with_alidns": "caddy-dns/alidns",
              "with_cache": "cache-handler",
              "with_s3_storage": "certmagic-s3",
              "with_trojan": "caddy-trojan",
          }

          wanted = (os.environ.get("VARIANTS") or "default full").split()
          build, verify = [], []
          for name in wanted:
              if name not in defs:
                  raise SystemExit("unknown variant: " + name)
              spec = defs[name]
              expected = [pkg for flag, pkg in packages.items() if spec.get(flag) == "true"]
              base = {"name": name, "suffix": spec["suffix"], "expect": " ".join(expected)}
              for target in ("binary", "runtime"):
                  build.append({**base, "target": target, **spec})
                  verify.append({**base, "target": target})

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("build_matrix=" + json.dumps({"include": build}) + "\n")
              fh.write("verify_matrix=" + json.dumps({"include": verify}) + "\n")
          print("build:", len(build), "verify:", len(verify))
          PY

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build_matrix) }}
    name: build ${{ matrix.name }} / ${{ matrix.target }}
    env:
      HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      PUSH_IMAGES: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          NAME: ${{ matrix.name }}
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          set -eu
          # Descriptive tag and short alias point at the same image.
          if [ "$TARGET" = "runtime" ]; then
            TAGS="$IMAGE:v$VERSION-$SUFFIX-alpine $IMAGE:v$VERSION-$NAME-alpine"
            [ "$NAME" = "default" ] && [ "$UPDATE_LATEST" = "true" ] && TAGS="$TAGS $IMAGE:latest-alpine"
          else
            TAGS="$IMAGE:v$VERSION-$SUFFIX $IMAGE:v$VERSION-$NAME"
            [ "$NAME" = "default" ] && [ "$UPDATE_LATEST" = "true" ] && TAGS="$TAGS $IMAGE:latest"
          fi
          FIRST="${TAGS%% *}"
          {
            echo "tags<<TAGS_EOF"
            for t in $TAGS; do echo "$t"; done
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "first=$FIRST" >> "$GITHUB_OUTPUT"
          echo "tags: $TAGS"

      - name: Login to Docker Hub
        if: env.HAS_TOKEN == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Report missing secrets
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set; build skipped."
          echo "Add both repository secrets, then re-run this workflow."

      - name: Skip when the tag already exists
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tags.outputs.first }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.tags.outputs.first }} already published, skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.exists.outputs.exists == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.exists == 'false'

      - name: Build and push
        if: steps.exists.outputs.exists == 'false' && env.HAS_TOKEN == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH_IMAGES }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CADDY_VERSION=${{ needs.resolve.outputs.version }}
            WITH_HUAWEICLOUD=${{ matrix.with_huaweicloud }}
            WITH_CLOUDFLARE=${{ matrix.with_cloudflare }}
            WITH_DNSPOD=${{ matrix.with_dnspod }}
            WITH_ALIDNS=${{ matrix.with_alidns }}
            WITH_CACHE=${{ matrix.with_cache }}
            WITH_S3_STORAGE=${{ matrix.with_s3_storage }}
            WITH_TROJAN=${{ matrix.with_trojan }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.target }}

  verify:
    needs: [resolve, build]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.verify_matrix) }}
    name: verify ${{ matrix.name }} / ${{ matrix.target }}
    env:
      HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      PUSH_IMAGES: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate on secrets
        id: gate
        run: |
          echo "ok=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          [ "$HAS_TOKEN" = "true" ] || echo "::warning::no Docker Hub secrets; nothing to verify"

      - name: Pull image
        if: steps.gate.outputs.ok == 'true'
        id: img
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -eu
          if [ "${{ matrix.target }}" = "runtime" ]; then
            REF="$IMAGE:v${VERSION}-${{ matrix.suffix }}-alpine"
          else
            REF="$IMAGE:v${VERSION}-${{ matrix.suffix }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          docker pull "$REF"

      - name: Version matches
        if: steps.gate.outputs.ok == 'true'
        env:
          EXPECTED: ${{ needs.resolve.outputs.version }}
        run: |
          set -eu
          if [ "${{ matrix.target }}" = "runtime" ]; then
            OUT=$(docker run --rm --entrypoint caddy "${{ steps.img.outputs.ref }}" version)
          else
            OUT=$(docker run --rm --entrypoint /caddy "${{ steps.img.outputs.ref }}" version)
          fi
          echo "$OUT"
          echo "$OUT" | grep -q "v${EXPECTED}" || {
            echo "::error::caddy version is not v${EXPECTED}"; exit 1; }

      - name: Expected plugins are compiled in
        if: steps.gate.outputs.ok == 'true' && matrix.target == 'runtime'
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          set -eu
          LIST=$(docker run --rm --entrypoint caddy "${{ steps.img.outputs.ref }}" list-modules --packages)
          echo "$LIST" | grep -E 'caddy-dns|cache-handler|certmagic-s3|caddy-trojan' || true
          missing=0
          for pkg in $EXPECT; do
            if echo "$LIST" | grep -q "$pkg"; then
              echo "ok: $pkg"
            else
              echo "::error::missing plugin package: $pkg"; missing=1
            fi
          done
          exit $missing

      - name: Config validates
        if: steps.gate.outputs.ok == 'true' && matrix.target == 'runtime'
        run: |
          docker run --rm \
            -v "$PWD/ci/smoke.Caddyfile:/etc/caddy/Caddyfile:ro" \
            --entrypoint caddy "${{ steps.img.outputs.ref }}" \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Serves traffic
        if: steps.gate.outputs.ok == 'true' && matrix.target == 'runtime'
        run: |
          set -eu
          docker run -d --name smoke -p 18123:8080 \
            -v "$PWD/ci/smoke.Caddyfile:/etc/caddy/Caddyfile:ro" \
            "${{ steps.img.outputs.ref }}"
          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18123/ >/tmp/body 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs smoke || true
          docker rm -f smoke >/dev/null
          [ "$ok" = "1" ] || { echo "::error::Caddy did not serve within 20s"; exit 1; }
          grep -qx "caddy-ok" /tmp/body || {
            echo "::error::unexpected response: $(cat /tmp/body)"; exit 1; }
          echo "served: $(cat /tmp/body)"

      - name: Runs as non-root
        if: steps.gate.outputs.ok == 'true' && matrix.target == 'runtime'
        run: |
          OUT=$(docker run --rm --entrypoint id "${{ steps.img.outputs.ref }}")
          echo "$OUT"
          echo "$OUT" | grep -q 'uid=1000' || { echo "::error::not running as uid 1000"; exit 1; }
